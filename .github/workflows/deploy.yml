name: deploy

on:
  pull_request:
    branches: [main]
    paths: ["services/**", "infra/**", ".github/workflows/**"]
  push:
    branches: [main]
    paths: ["services/**", "infra/**", ".github/workflows/**"]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-north-1
  TF_VERSION: 1.16.5

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -check -recursive -no-color

      - name: Init without backend
        run: terraform init -backend=false -input=false -no-color

      - name: Validate
        run: terraform validate -no-color
  
  build:
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [vote, result, worker]
    env:
      REPO: ${{ vars.NAME_PREFIX }}-${{ matrix.service }}
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Check if the tag already exists
        id: exists
        run: |
          if aws ecr describe-images --repository-name "$REPO" --image-ids imageTag="$TAG" > /dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.exists.outputs.found == 'false'

      - uses: docker/build-push-action@v6
        if: steps.exists.outputs.found == 'false'
        with:
          context: services/${{ matrix.service }}
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.REPO }}:${{ env.TAG }}
  
  
  plan:
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [dev, prod]
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Init
        run: >
          terraform init -input=false -no-color
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=voting-app/${{ matrix.env }}/terraform.tfstate"
          -backend-config="region=eu-north-1"
          -backend-config="use_lockfile=true"

      - name: Plan
        run: >
          terraform plan -input=false -no-color -lock-timeout=5m
          -var-file=envs/${{ matrix.env }}.tfvars
          -var=name_prefix=${{ vars.NAME_PREFIX }}
          -var=image_tag=${{ github.sha }}

  deploy-dev:
    if: github.event_name == 'push'
    needs: build
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: dev
      image_tag: ${{ github.sha }}

  deploy-prod:
    needs: deploy-dev
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: prod
      image_tag: ${{ github.sha }}